/* ===== base ===== */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--text);font:400 var(--fs-base)/var(--lh-base) var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.dim{color:var(--text-dim)}.faint{color:var(--text-faint)}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);font-weight:600}
.tile .eyebrow,.idblock .k,.field label{text-transform:none;letter-spacing:0;font-size:var(--fs-sm);font-weight:500}
.lead{margin:2px 0 0;color:var(--text-dim);font-size:var(--fs-base);max-width:80ch}
:focus-visible{outline:none;box-shadow:var(--glow-accent)}
.kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);border:1px solid var(--hairline);border-radius:4px;padding:1px 5px;background:var(--surface-1)}
.hint{margin:14px 0 0;color:var(--text-faint);font-size:var(--fs-sm)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hairline);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.none{background:var(--hairline)}

/* ===== shell + drawer ===== */
.shell{display:grid;grid-template-columns:var(--dw) 1fr;height:100vh;transition:grid-template-columns var(--d-base) var(--e-standard)}
.shell.mini{grid-template-columns:var(--dw-min) 1fr}
.drawer{background:var(--surface-1);border-right:1px solid var(--hairline);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.dhead{height:var(--ctx-h);display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--hairline);flex:none}
.dhead .logo{width:26px;height:26px;flex:none}
.dhead .name{font:650 var(--fs-md)/20px var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.dhead .collapse{margin-left:auto}
.iconbtn{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-dim);transition:background var(--d-fast),color var(--d-fast);flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}.iconbtn svg{width:16px;height:16px}
.dsearch{margin:10px 10px 6px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-sm);color:var(--text-faint);cursor:text;white-space:nowrap;overflow:hidden}
.dsearch .kbd{margin-left:auto}
.dscroll{overflow:auto;flex:1;padding:4px 10px 10px}
.dco{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--r-md);cursor:pointer;transition:background var(--d-fast),box-shadow var(--d-fast);margin:4px 0 8px}
.dco:hover{background:var(--surface-3);box-shadow:var(--aberration)}.dco.on{background:var(--accent-soft)}
.dco .ring{width:30px;height:30px}.dco .ring svg{width:30px;height:30px}.dco .ring .arc,.dco .ring .track{stroke-width:3}.dco .ring .core{width:8px;height:8px}
.dco .t{min-width:0}.dco .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dco .t span{font-size:var(--fs-xs);color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap}
.dgrp{display:flex;align-items:center;gap:6px;padding:10px 8px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
.dgrp .car{transition:transform var(--d-fast);font-size:9px}.dgrp.closed .car{transform:rotate(-90deg)}
.dgrp.closed+.dmods{display:none}
.dmod{position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-dim);transition:background var(--d-fast),color var(--d-fast),box-shadow var(--d-fast);white-space:nowrap}
.dmod:hover{background:var(--surface-3);color:var(--text);box-shadow:var(--aberration)}
.dmod.on{background:var(--accent-soft);color:var(--text)}.dmod.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px}
.dmod svg{width:16px;height:16px;flex:none}.dmod .n{flex:1;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dmod .s{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-faint)}.dmod .s.crit{color:var(--crit-text)}.dmod .s.warn{color:var(--warn-text)}
.dmod .pin{opacity:0;font-size:11px;color:var(--text-faint)}.dmod:hover .pin{opacity:1}.dmod .pin.on{opacity:1;color:var(--accent)}
.dfoot{border-top:1px solid var(--hairline);padding:8px 10px;flex:none}
.dfoot .dmod .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--info);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;font-family:var(--font-mono)}
.shell.mini .dhead .name,.shell.mini .dsearch,.shell.mini .dgrp,.shell.mini .dmod .n,.shell.mini .dmod .s,.shell.mini .dmod .pin,.shell.mini .dco .t,.shell.mini .dmod .cnt{display:none}
.shell.mini .dmod{justify-content:center;padding:0}.shell.mini .dmod.on::before{display:none}.shell.mini .dco{justify-content:center;padding:6px}
.shell.mini .dhead{padding:0;justify-content:center}.shell.mini .dhead .collapse{display:none}
.shell.mini .dmod .dot{position:absolute;right:6px;top:7px;width:7px;height:7px;box-shadow:0 0 0 2px var(--surface-1)}
/* flyout */
.fly{position:fixed;z-index:30;width:300px;background:var(--surface-1);box-shadow:var(--el-2);border-radius:var(--r-md);padding:10px 12px;display:none;animation:pal var(--d-fast) var(--e-enter)}
.fly.open{display:block}
.fly h4{margin:0 0 8px;font-size:var(--fs-base);font-weight:600;display:flex;align-items:center;gap:8px}
.fly .types{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.fly .ty{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-xs);cursor:pointer;font-size:var(--fs-sm)}
.fly .ty:hover{background:var(--surface-3)}.fly .ty .s{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-dim)}
.fly .acts{display:flex;gap:6px}

/* ===== drawer: reusable NavTree ===== */
.drawer{position:relative}
.dresize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
.dresize:hover,.dresize.on{background:var(--accent-soft)}
.shell.mini .dresize{display:none}
.dsearch input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--text);font-size:var(--fs-sm)}
.dsearch input::placeholder{color:var(--text-faint)}
.dsearch .kbd{cursor:pointer}
.dsec{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none;border-radius:var(--r-xs)}
.dsec:hover{color:var(--text-dim)}
.dsec .car{transition:transform var(--d-fast);font-size:9px;width:10px}
.dsec.closed .car{transform:rotate(-90deg)}
.dsec .cnt{margin-left:auto;font-family:var(--font-mono);letter-spacing:0;font-weight:500}
.dsec.closed+.ditems{display:none}
.drow{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 6px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-dim);transition:background var(--d-fast),color var(--d-fast),box-shadow var(--d-fast);white-space:nowrap;outline:none}
.drow:hover{background:var(--surface-3);color:var(--text)}
.drow:focus-visible{box-shadow:var(--glow-accent);color:var(--text)}
.drow.on{background:var(--accent-soft);color:var(--text)}
.drow.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px}
.drow.child{height:30px;padding-left:34px;font-size:var(--fs-sm)}
.drow.child .lbl{font-weight:400}
.drow .chev{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;color:var(--text-faint);flex:none;transition:transform var(--d-fast),background var(--d-fast)}
.drow .chev:hover{background:var(--surface-2);color:var(--text)}
.drow.open>.chev{transform:rotate(90deg)}
.drow .chev.none{visibility:hidden}
.drow .ico{width:16px;height:16px;flex:none;display:grid;place-items:center}
.drow .ico svg{width:16px;height:16px}
.drow .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.drow .bdg{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-faint)}
.drow .bdg.crit{color:var(--crit-text)}.drow .bdg.warn{color:var(--warn-text)}
.drow .pin{opacity:0;font-size:11px;color:var(--text-faint);width:14px;text-align:center}
.drow:hover .pin{opacity:1}.drow .pin.on{opacity:1;color:var(--accent)}
.drow .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--info);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;font-family:var(--font-mono)}
.drow .cnt.q{background:var(--surface-3);color:var(--text-dim)}
.dchildren{overflow:hidden}
.dchildren.anim{animation:dopen var(--d-base) var(--e-standard)}
@keyframes dopen{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dempty{padding:16px 8px;color:var(--text-faint);font-size:var(--fs-sm)}
mark.hl{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
.userrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);cursor:pointer;margin-top:4px}
.userrow:hover{background:var(--surface-3)}
.userrow .t{min-width:0;flex:1}.userrow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userrow .t span{font-size:var(--fs-xs);color:var(--text-dim)}
.shell.mini .drow{justify-content:center;padding:0;height:36px}.shell.mini .drow .lbl,.shell.mini .drow .bdg,.shell.mini .drow .pin,.shell.mini .drow .chev,.shell.mini .drow .cnt,.shell.mini .dsec,.shell.mini .drow.child,.shell.mini .userrow .t,.shell.mini .dsearch{display:none}
.shell.mini .drow.on::before{display:none}
.shell.mini .drow .dot{position:absolute;right:6px;top:7px;width:7px;height:7px;box-shadow:0 0 0 2px var(--surface-1)}
.shell.mini .ditems{display:block!important}
.shell.mini .dsep{height:1px;background:var(--hairline-soft);margin:6px 10px}
.dsep{display:none}
/* dropdown (company switcher, user menu) */
.dd{position:fixed;z-index:35;min-width:260px;background:var(--surface-1);box-shadow:var(--el-3);border-radius:var(--r-md);padding:6px;display:none;animation:pal var(--d-fast) var(--e-enter)}
.dd.open{display:block}
.dd .ddh{padding:6px 8px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:600}
.dd .ddi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-base)}
.dd .ddi:hover,.dd .ddi.on{background:var(--surface-3)}
.dd .ddi .m{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-faint)}
.dd .ddi .chk{width:14px;color:var(--accent)}
.dd .ddsep{height:1px;background:var(--hairline-soft);margin:4px 0}
.dd .ddin{display:flex;align-items:center;gap:8px;padding:4px 8px 8px}
.dd .ddin input{flex:1;height:30px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:0 10px;outline:0;color:var(--text);font-size:var(--fs-sm)}

/* ===== main ===== */
.main{display:grid;grid-template-rows:var(--ctx-h) 1fr;min-width:0;min-height:0}
.ctx{display:flex;align-items:center;background:var(--surface-1);border-bottom:1px solid var(--hairline);padding:0 16px 0 0}
.ctx .pick{display:flex;flex-direction:column;justify-content:center;padding:0 14px;height:100%;border-right:1px solid var(--hairline);min-width:110px;cursor:pointer;transition:background var(--d-fast)}
.ctx .pick:hover{background:var(--surface-3)}
.ctx .pick .k{font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);line-height:14px}
.ctx .pick .v{font-weight:500;line-height:18px;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.ctx .pick .v .id{font-family:var(--font-mono);color:var(--text-dim);font-size:var(--fs-sm)}
.ctx .pick .v::after{content:"▾";color:var(--text-faint);font-size:10px;margin-left:2px}
.ctx .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--text-dim);font-size:var(--fs-sm);white-space:nowrap}
.chip .mono{color:var(--text)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--text);font-weight:600;font-size:12px}
.page{display:grid;grid-template-rows:auto 1fr;min-height:0}
.phead{padding:12px 24px 0;display:flex;flex-direction:column;gap:8px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--text-faint);flex-wrap:wrap}
.crumbs a{color:var(--text-dim);cursor:pointer}.crumbs a:hover{color:var(--accent)}.crumbs b{color:var(--text);font-weight:500}
.mhead{display:flex;align-items:center;gap:14px}
.mhead h1{font:650 var(--fs-xl)/30px var(--font-display);margin:0;letter-spacing:-.01em}
.mhead .health{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:var(--fs-sm)}
.mhead .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--r-sm);font-weight:500;transition:transform var(--d-fast) var(--e-spring),background var(--d-fast),box-shadow var(--d-fast),color var(--d-fast);white-space:nowrap}
.btn:active{transform:scale(.97);transition-duration:var(--d-instant)}

/* tiles / ring / strip / cards */

.tile .delta{font-size:var(--fs-sm);font-family:var(--font-mono)}.tile .delta.up{color:var(--crit-text)}.tile .delta.down{color:var(--ok-text)}
.ring{width:44px;height:44px;flex:none;position:relative}.ring svg{width:44px;height:44px;transform:rotate(-90deg)}

.ring.done .core{transform:scale(1)}.ring.done.ok .core{background:var(--ok)}.ring.done.crit .core{background:var(--crit)}.ring.done.warn .core{background:var(--warn)}

.strip i:hover{transform:scaleY(1.15)}.strip i.ok{background:var(--ok)}.strip i.crit{background:var(--crit)}.strip i.warn{background:var(--warn)}
.strip i.last{box-shadow:0 0 0 2px var(--ground),0 0 0 3px var(--text)}

.list{display:flex;flex-direction:column}

.input input{background:none;border:0;outline:0;width:100%;font-family:var(--font-mono);font-size:var(--fs-sm)}

.grid tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--flare)}.grid tbody tr.sel{background:color-mix(in srgb,var(--flare-soft) 60%,transparent)}
.ent{display:flex;flex-direction:column;line-height:15px}.ent .n{font-weight:500}.ent .m{font-family:var(--font-mono);color:var(--text-dim);font-size:11px}

.parity{display:inline-flex;gap:3px}.parity i{width:8px;height:8px;border-radius:50%;display:block}

/* focus panel */
.panel{background:var(--surface-1);border-left:1px solid var(--hairline);box-shadow:var(--el-2);display:flex;flex-direction:column;min-width:0;overflow:hidden}

.pb{overflow:auto;padding:14px 16px;flex:1}
.lvl{animation:focus-in var(--d-slow) var(--e-enter) both}.lvl.out{animation:focus-out var(--d-base) var(--e-exit) both}
@keyframes focus-in{from{opacity:0;filter:blur(8px);transform:translateX(12px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes focus-out{to{opacity:0;filter:blur(4px);transform:translateX(-8px)}}

.tev .t{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);grid-column:2;grid-row:1/3;align-self:start}.tev .m{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}

.code .h{color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-size:10px;margin-bottom:4px;display:block}
.code .bad{color:var(--crit-text);background:var(--crit-soft)}.code .good{color:var(--ok-text);background:var(--ok-soft)}
.wb{display:grid;gap:10px}.wb .row{display:flex;gap:6px;align-items:center}
.wb .tabsm{display:flex;gap:2px;border-bottom:1px solid var(--hairline)}.wb .tabsm button{padding:6px 10px;font-size:var(--fs-sm);color:var(--text-dim);border-bottom:2px solid transparent}.wb .tabsm button.on{color:var(--text);border-color:var(--accent)}
.hist{display:flex;gap:4px;flex-wrap:wrap}

/* flows */
.flow{display:grid;grid-template-columns:250px 1fr;gap:16px;min-height:0}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.fhead h3{margin:0;font-size:var(--fs-lg);font-weight:600}.fhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tl{position:relative;padding-left:36px;display:flex;flex-direction:column;gap:12px}
.step{position:relative;background:var(--surface-1);border-radius:var(--r-md);box-shadow:var(--el-1);padding:10px 14px;transition:box-shadow var(--d-fast),transform var(--d-base)}
.step:hover{box-shadow:var(--el-1),var(--aberration)}

.step .hd{display:flex;align-items:center;gap:10px}.step .path{font-family:var(--font-mono);font-size:var(--fs-sm)}
.step .dur{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-faint);min-width:52px;text-align:right}
.step .bd{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm)}
.step .kv{display:flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}.step .kv .k{color:var(--text-faint);width:56px}.step .kv .badge{margin-left:auto}
.step .detail{display:none;margin-top:8px;gap:8px;grid-template-columns:1fr 1fr}.step.fail .detail{display:grid}
.dl{position:absolute;left:11px;width:2px;background:var(--hairline);overflow:hidden}
.dl::after{content:"";position:absolute;left:0;top:-24px;width:2px;height:24px;background:linear-gradient(var(--flare),transparent);opacity:0}
.dl.live::after{opacity:1;animation:refract 1.2s linear infinite}.dl.done{background:var(--ok)}.dl.bad{background:var(--crit)}
@keyframes refract{to{transform:translateY(calc(var(--h,80px) + 24px))}}
@media (prefers-reduced-motion:reduce){.dl.live::after{animation:none;opacity:0}.ring.running .arc{animation:none}}

/* ===== data & sync (flow map, hops, failure grid, evidence, issues, rules) ===== */
.fmap{background:var(--surface-1);border-radius:var(--r-md);box-shadow:var(--el-1);padding:14px 16px;position:relative}
.fmap svg{width:100%;height:230px;display:block}

.fmap .elabel.ok text{fill:var(--ok-text)}.fmap .elabel.warn text{fill:var(--warn-text)}.fmap .elabel.crit text{fill:var(--crit-text)}.fmap .elabel.soon text{fill:var(--text-faint)}
.legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--text-dim);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.hops{display:flex;align-items:stretch;gap:0;overflow:auto;padding:4px 0 8px}
.hop{position:relative;min-width:190px;flex:1;background:var(--surface-1);border-radius:var(--r-md);box-shadow:var(--el-1);padding:12px 14px;cursor:pointer;transition:box-shadow var(--d-fast)}
.hop:hover{box-shadow:var(--el-1),var(--aberration)}
.hop.on{box-shadow:var(--el-1),inset 0 0 0 1px var(--accent)}

$('#scenList').innerHTML=SCEN.map((s,i)=>`<div class="si" data-i="${i}"><span class="who ${s.cls}">${s.who}</span><b>${s.title}</b><span>${s.sub}</span><span class="go">▶</span></div>`).join('');
$$('.si').forEach(el=>el.onclick=()=>play(SCEN[+el.dataset.i]));
$('#scenBtn').onclick=()=>scen.classList.toggle('open');$('#scenClose').onclick=()=>scen.classList.remove('open');$('#narrStop').onclick=()=>{playing=false;narr.classList.remove('open');};
function spot(el){if(!el)return;el.classList.remove('spot');void el.offsetWidth;el.classList.add('spot');el.scrollIntoView&&el.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'});}
async function play(s){if(playing)return;playing=true;scen.classList.remove('open');S.tenantView=false;narr.classList.add('open');
 for(let i=0;i<s.steps.length&&playing;i++){const [text,fn,wait]=s.steps[i];$('.st',narr).textContent=`${i+1}/${s.steps.length}`;$('#narrText').textContent=text;await sleep(500);if(!playing)break;try{fn();}catch(e){}await sleep(wait||2600);}
 playing=false;narr.classList.remove('open');}

/* boot: deep link like #/module/sync/flows works */
bootFromHash();
